name: Build iOS to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Select latest available Xcode (Apple now requires iOS 26 SDK+)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          echo "Available Xcode installs:"
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Generate iOS project with expo prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Restore Fastlane config (prebuild --clean wipes ios/)
        run: |
          mkdir -p ios/fastlane
          cp ios-fastlane-config/Fastfile ios/fastlane/Fastfile
          cp ios-fastlane-config/Matchfile ios/fastlane/Matchfile

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Build and Upload to TestFlight with Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GIT_AUTHORIZATION: ${{ secrets.CERT_REPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
        run: |
          cd ios
          fastlane beta

      - name: Upload raw build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build_logs
            ~/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect built .app (Info.plist + entitlements) for debugging
        if: always()
        run: |
          mkdir -p ios/debug_inspect
          IPA=$(find ios -maxdepth 1 -name "*.ipa" | head -n1)
          if [ -n "$IPA" ]; then
            cp "$IPA" ios/debug_inspect/app.ipa
            UNZIP_DIR=$(mktemp -d)
            unzip -q "$IPA" -d "$UNZIP_DIR"
            APP_DIR=$(find "$UNZIP_DIR/Payload" -maxdepth 1 -name "*.app" | head -n1)
            if [ -n "$APP_DIR" ]; then
              plutil -convert xml1 -o ios/debug_inspect/Info.plist "$APP_DIR/Info.plist" || true
              codesign -d --entitlements :ios/debug_inspect/entitlements.plist "$APP_DIR" || true
              codesign -dvvv "$APP_DIR" > ios/debug_inspect/codesign-info.txt 2>&1 || true
              ls -la "$APP_DIR" > ios/debug_inspect/app_bundle_contents.txt || true
            fi
          else
            echo "No .ipa found to inspect" > ios/debug_inspect/NO_IPA_FOUND.txt
          fi

      - name: Upload debug inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-inspect
          path: ios/debug_inspect
          if-no-files-found: warn
          retention-days: 7

      - name: ✅ Build Success
        if: success()
        run: |
          echo "✅ iOS build uploaded to TestFlight"
          echo "Tech: GitHub Actions + Xcode + Fastlane"
          echo "Cost: \$0"

      - name: ❌ Build Failed
        if: failure()
        run: |
          echo "Build failed. Check logs above for details."
          exit 1
