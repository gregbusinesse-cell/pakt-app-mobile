name: Build iOS to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm install

      - name: Generate iOS project with expo prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Restore Fastlane config (prebuild --clean wipes ios/)
        run: |
          mkdir -p ios/fastlane
          cp ios-fastlane-config/Fastfile ios/fastlane/Fastfile
          cp ios-fastlane-config/Matchfile ios/fastlane/Matchfile

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Build and Upload to TestFlight with Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GIT_AUTHORIZATION: ${{ secrets.CERT_REPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
        run: |
          cd ios
          fastlane beta

      - name: Upload raw build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build_logs
            ~/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7

      - name: ✅ Build Success
        if: success()
        run: |
          echo "✅ iOS build uploaded to TestFlight"
          echo "Tech: GitHub Actions + Xcode + Fastlane"
          echo "Cost: \$0"

      - name: ❌ Build Failed
        if: failure()
        run: |
          echo "Build failed. Check logs above for details."
          exit 1
