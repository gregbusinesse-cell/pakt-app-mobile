name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest --force

      - name: Build iOS (remote - Expo servers)
        run: eas build --platform ios --profile production --wait --json > build-output.json

      - name: Extract Build ID and Download IPA
        run: |
          echo "🔍 Extracting Build ID from EAS..."
          cat build-output.json | head -20
          BUILD_ID=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('build-output.json')); console.log(Array.isArray(data) ? data[0].id : data.id)" 2>/dev/null || echo "")
          if [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to extract Build ID, trying grep..."
            BUILD_ID=$(cat build-output.json | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          fi
          if [ -z "$BUILD_ID" ]; then
            echo "❌ Still failed. Dumping JSON:"
            cat build-output.json
            exit 1
          fi
          echo "✅ Build ID: $BUILD_ID"
          IPA_URL="https://expo.dev/artifacts/eas/${BUILD_ID}.ipa"
          echo "📥 Downloading from: $IPA_URL"
          curl -L -o app.ipa "$IPA_URL" --progress-bar
          if [ ! -f app.ipa ] || [ ! -s app.ipa ]; then
            echo "❌ IPA download failed or empty"
            ls -la app.ipa 2>&1
            exit 1
          fi
          ls -lh app.ipa
          echo "✅ IPA downloaded successfully!"

      - name: Upload to TestFlight with Transporter
        run: |
          echo "🚀 Uploading to TestFlight..."
          xcrun altool --upload-app \
            -f app.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_PASSWORD }}" \
            --output-format json || true
          echo "✅ Upload request sent to TestFlight!"
