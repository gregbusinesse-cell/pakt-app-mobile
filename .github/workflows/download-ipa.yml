name: Download Latest IPA

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest --force

      - name: Get Latest Build Info
        run: |
          eas build:list --platform ios --limit 1 --json > build-info.json
          cat build-info.json

      - name: Download Latest IPA
        run: |
          IPA_URL=$(jq -r '.[0].artifacts.buildUrl' build-info.json)
          echo "📥 Downloading from: $IPA_URL"
          curl -L -o pakt-latest.ipa "$IPA_URL"
          ls -lh pakt-latest.ipa
          echo "✅ IPA ready for TestFlight"

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pakt-ios-latest
          path: pakt-latest.ipa
          retention-days: 7
