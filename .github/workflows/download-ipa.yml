name: Download and Upload IPA to TestFlight

on:
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download Latest IPA
        run: |
          echo "📥 Downloading IPA..."
          curl -L -o pakt.ipa "https://expo.dev/artifacts/eas/i4_x-KzWdOwEqmKHxjG_z6INZ4bNJRRCJld2IDgRles.ipa"
          ls -lh pakt.ipa
          echo "✅ IPA downloaded"

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pakt-ios-testflight
          path: pakt.ipa
          retention-days: 30
