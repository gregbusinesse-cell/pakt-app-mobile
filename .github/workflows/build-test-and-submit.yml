name: Build, Test, Submit to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-submit:
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest --force

      - name: Build iOS
        run: eas build --platform ios --profile production --wait --json > build-output.json

      - name: Extract Build ID
        run: |
          BUILD_ID=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('build-output.json')); console.log(Array.isArray(data) ? data[0].id : data.id)")
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "✅ Build ID: $BUILD_ID"

      - name: Download IPA
        run: |
          IPA_URL="https://expo.dev/artifacts/eas/${BUILD_ID}.ipa"
          echo "📥 Downloading: $IPA_URL"
          curl -L -o app.ipa "$IPA_URL" --progress-bar
          ls -lh app.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pakt-ios-ipa
          path: app.ipa
          retention-days: 7

      - name: Submit to TestFlight via EAS
        run: |
          echo "🚀 Submitting to TestFlight..."
          eas submit --platform ios --profile testflight --latest --non-interactive
        continue-on-error: true

      - name: Create Download Link for Manual Upload
        run: |
          echo "📝 INSTRUCTIONS FOR MANUAL UPLOAD:"
          echo ""
          echo "If automated submission failed, download the IPA from GitHub Artifacts:"
          echo "1. Go to: https://github.com/gregbusinesse-cell/pakt-app-mobile/actions/runs/${{ github.run_id }}"
          echo "2. Download artifact: pakt-ios-ipa"
          echo "3. Go to App Store Connect → Distribution → iOS"
          echo "4. Upload the IPA to TestFlight"
          echo ""
          echo "Build completed at: $(date)"
