name: Build iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS
        run: npx expo prebuild --clean --platform ios

      - name: Build iOS with Gradle (local)
        run: cd ios && xcodebuild -workspace pakt.xcworkspace -scheme pakt -configuration Release -derivedDataPath build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pakt.ipa
          path: ios/build/Build/Products/Release-iphoneos/pakt.app
