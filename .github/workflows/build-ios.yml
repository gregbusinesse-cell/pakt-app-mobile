name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest --force

      - name: Build iOS (remote - Expo servers)
        run: eas build --platform ios --profile production --wait --json > build-output.json

      - name: Download IPA from EAS
        run: |
          IPA_URL=$(jq -r '.[0].artifacts.buildUrl' build-output.json)
          echo "IPA URL: $IPA_URL"
          curl -L -o pakt.ipa "$IPA_URL"
          ls -lh pakt.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pakt-ios.ipa
          path: pakt.ipa
          retention-days: 7

      - name: Submit to TestFlight via EAS
        run: eas submit --platform ios --profile production --latest --non-interactive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
